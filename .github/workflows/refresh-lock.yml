name: Refresh dependency lockfile

on:
  push:
    branches:
      - chatgpt/update-ankh-tooling

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/update-ankh-tooling
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh lockfile
        run: bun install

      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          rm .github/workflows/refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/refresh-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:chatgpt/update-ankh-tooling
