name: npm smoke

on:
  push:
    branches:
      - fix/120-npm-tarball-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Verify Ankh 0.10.0 registry artifact
        run: |
          set -euxo pipefail
          npm view @ankhorage/ankh@0.10.0 version dist.tarball dist.integrity --json
          tarball="$(npm view @ankhorage/ankh@0.10.0 dist.tarball)"
          test -n "$tarball"
          curl --fail --location --retry 2 --output /tmp/ankh-0.10.0.tgz "$tarball"
          tar -tzf /tmp/ankh-0.10.0.tgz > /tmp/ankh-contents.txt
          head -n 20 /tmp/ankh-contents.txt
          npm pack @ankhorage/ankh@0.10.0 --pack-destination /tmp
          bun add --global @ankhorage/ankh@0.10.0
          ankh --version
