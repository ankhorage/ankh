name: Auth5 Doctor 0.10 consumer gate

on:
  push:
    branches:
      - agent/auth5-doctor-010-consumer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth5-doctor-010-consumer
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Update Doctor lockfile
        run: bun install

      - name: Format changed sources
        run: bun run format

      - name: Validate consumer
        run: |
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status
          git diff --check

      - name: Commit lockfile and cleanup
        run: |
          rm .github/workflows/auth5-doctor-010-consumer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json tests/doctorCoreProviderReadiness.test.ts .changeset/auth5-doctor-010-consumer.md .github/workflows/auth5-doctor-010-consumer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Validate Doctor 0.10 core provider consumer"
          git push origin HEAD:agent/auth5-doctor-010-consumer
