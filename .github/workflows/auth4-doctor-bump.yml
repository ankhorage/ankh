name: Auth4 Doctor consumer bump

on:
  push:
    branches:
      - agent/auth4-doctor-readiness

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth4-doctor-readiness
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Resolve Doctor dependency
        run: |
          bun update @ankhorage/doctor --lockfile-only
          bun install --frozen-lockfile

      - name: Validate consumer
        run: |
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck

      - name: Commit validated lockfile
        run: |
          rm .github/workflows/auth4-doctor-bump.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock .github/workflows/auth4-doctor-bump.yml
          git diff --cached --stat
          git commit -m 'Resolve Doctor 0.9 dependency'
          git push origin HEAD:agent/auth4-doctor-readiness
